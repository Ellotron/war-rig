name: Generate technology cards

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/cards/**"
      - "assets/cards/**"
      - "!assets/tech.png"
      - "fonts/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/generate-tech-cards.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      - name: Install native canvas dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: Install dependencies
        run: yarn ci
      - name: Generate technology card sheet
      - name: Install dependencies
        run: yarn install
      - name: Generate mission card sheets
      - name: Generate technology card sheet
        run: yarn run t-cards
      - name: Generate mission card sheets
        run: yarn run m-cards
      - name: Commit generated sheets to pull request branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tech.png assets/cards/missions1.png assets/cards/missions2.png assets/cards/missions3.png
          if git diff --cached --quiet; then
            echo "Generated sheets have no changes."
          else
            git commit -m "Update generated card sheets"
            git push
          fi
      - name: Upload generated card sheets
        uses: actions/upload-artifact@v4
        with:
          name: generated-card-sheets
          path: |
            assets/tech.png
            assets/cards/missions1.png
            assets/cards/missions2.png
            assets/cards/missions3.png
          if-no-files-found: error
          retention-days: 14
