name: Generate technology cards

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/cards/**"
      - "assets/cards/**"
      - "!assets/tech.png"
      - "fonts/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/generate-tech-cards.yml"

permissions:
  contents: read

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install native canvas dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: Install dependencies
        run: npm ci
      - name: Generate technology card sheet
        run: npm run t-cards
      - name: Generate mission card sheets
        run: npm run m-cards
      - name: Upload generated card sheets
        uses: actions/upload-artifact@v4
        with:
          name: generated-card-sheets
          path: |
            assets/tech.png
            assets/cards/missions1.png
            assets/cards/missions2.png
            assets/cards/missions3.png
          if-no-files-found: error
          retention-days: 14
